[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-monitor"
dynamic = ["version"]
description = "Keeps enrolled GitHub repository READMEs accurate by proposing evidence-based documentation pull requests."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.7,<3",
    "requests>=2.32,<3",
    "keyring>=25,<26",
]

[project.urls]
Homepage = "https://github.com/poplislive/readme-monitor"
Issues = "https://github.com/poplislive/readme-monitor/issues"
Changelog = "https://github.com/poplislive/readme-monitor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
readme-monitor = "readme_monitor.cli:main"

[tool.setuptools.dynamic]
version = { attr = "readme_monitor.__version__" }

[tool.setuptools.packages.find]
include = ["readme_monitor*"]

[tool.setuptools.package-data]
readme_monitor = ["templates/*.md", "templates/*.toml", "web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_host: use the real production-host guard instead of the offline stand-in"]

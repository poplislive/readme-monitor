name: Screenshots

# Run by hand after an interface change: Actions → Screenshots → Run workflow. It regenerates the
# README pictures in docs/screenshots/ from the simulation (scripts/screenshots.mjs: invented sample
# repositories, nothing sent to GitHub or Anthropic) and pushes them to a new branch, then links the
# pull request to open. It never pushes to an existing branch, and it does not open the pull request
# itself: that would need the setting that also lets workflows approve pull requests. With "push"
# off it only keeps the pictures as a downloadable artifact, to check the capture without a branch.
on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the pictures to a new branch (off - keep them as an artifact only)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  refresh:
    name: Regenerate the README screenshots
    runs-on: windows-latest # the setup picture shows the platform
    permissions:
      contents: write # pushes one new branch with the pictures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the pinned dependencies
        run: python -m pip install -r requirements.txt -e .
      - name: Capture
        run: node scripts/screenshots.mjs --python python
      - name: Keep the pictures as an artifact
        if: ${{ !inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
          retention-days: 7
      - name: Push the new pictures to a branch
        if: ${{ inputs.push }}
        shell: bash
        run: |
          set -eu
          if git diff --quiet -- docs/screenshots; then
            echo "The pictures are unchanged."
            exit 0
          fi
          branch="screenshots/run-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/screenshots
          git commit -m "Refresh the README screenshots from the simulation" \
            -m "Regenerated by the Screenshots workflow (run ${GITHUB_RUN_ID}) with scripts/screenshots.mjs: invented sample repositories, nothing sent to GitHub or Anthropic. The desktop pictures show the clock times of the simulated runs, so they change on every capture. Compare the pictures before merging."
          git push origin "$branch"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${branch}?expand=1"
          echo "::notice::The new pictures are on branch $branch. Open the pull request: $url"
          echo "The new pictures are on branch \`$branch\`. [Open the pull request]($url) and compare them before merging." >> "$GITHUB_STEP_SUMMARY"

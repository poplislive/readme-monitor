[package]
name = "readme-monitor-desktop"
version = "0.3.0"
description = "ReadmeMonitor desktop application"
license = "Apache-2.0"
repository = "https://github.com/poplislive/readme-monitor"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Tauri 2 stable line (3.x is alpha). Exact resolved versions are in Cargo.lock.
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = ">=2.7, <2.7.3" # 2.7.3 was published on the day this was written; take it deliberately later
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
